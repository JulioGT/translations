<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="64" cy="64" r="60" fill="#007acc"/>
    
    <!-- CLASS text -->
    <text x="64" y="50" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">CLASS</text>
    
    <!-- Translation symbol (T with arrows) -->
    <g transform="translate(64, 75)" fill="white">
        <!-- T shape -->
        <rect x="-15" y="-15" width="30" height="4"/>
        <rect x="-2" y="-15" width="4" height="30"/>
        
        <!-- Circular arrows -->
        <path d="M -20,0 A 20,20 0 1,1 20,0" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <path d="M 20,0 A 20,20 0 1,1 -20,0" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Arrow heads -->
        <path d="M -15,-5 L -25,0 L -15,5" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 15,5 L 25,0 L 15,-5" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg> 